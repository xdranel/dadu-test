# Host-only resource adaptation for the1vCPU/1GB VPS; auto-merged by Docker Compose.
services:
  db:
    mem_limit: 384m
    memswap_limit: 768m
    cpus: 0.65
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=64M
      - --max-connections=20
      - --performance-schema=OFF
      - --mysqlx=OFF
      - --table-open-cache=200
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
  app:
    mem_limit: 320m
    memswap_limit: 640m
    cpus: 0.85
    volumes:
      - ./docker/vps/php-lowmem.ini:/usr/local/etc/php/conf.d/zzz-vps.ini:ro
      - ./docker/vps/pool-lowmem.conf:/usr/local/etc/php-fpm.d/zzz-vps.conf:ro
  scheduler:
    mem_limit: 128m
    memswap_limit: 256m
    cpus: 0.20
    volumes:
      - ./docker/vps/php-lowmem.ini:/usr/local/etc/php/conf.d/zzz-vps.ini:ro
  worker:
    mem_limit: 192m
    memswap_limit: 384m
    cpus: 0.40
    command: [php, -d, max_execution_time=0, artisan, 'queue:work', database, '--sleep=3', '--tries=1', '--memory=96', '--timeout=14400', '--max-time=3600', '--no-interaction']
    volumes:
      - ./docker/vps/php-lowmem.ini:/usr/local/etc/php/conf.d/zzz-vps.ini:ro
  web:
    mem_limit: 32m
    memswap_limit: 64m
    cpus: 0.20
  setup:
    mem_limit: 320m
    memswap_limit: 640m
    cpus: 0.85
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    mem_limit: 64m
    memswap_limit: 128m
    cpus: 0.30
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  caddy_data:
  caddy_config:
