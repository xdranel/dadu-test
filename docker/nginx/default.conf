server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 192m;
    client_body_timeout 120s;
    server_tokens off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Hosted test accounts are provisioned by the CLI. The current guest reset
    # flow has no ownership proof (docs/61f), so it is not exposed on this host.
    location ~ ^/(register|forgot-password|lupa-password|reset-password)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # This deployment is served exclusively through a public HTTPS hostname.
        # NPM/cloudflared may use HTTP on the internal network.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_read_timeout 180s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
